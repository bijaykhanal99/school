<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - North Point Academy</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
     <link rel="icon" type="image" href="logo.jpg">

    <style>
        :root {
            --primary: #4f46e5;
            --dark: #0f172a;
            --light: #f8fafc;
            --white: #ffffff;
            --success: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--light); 
            margin: 0; padding: 20px; 
        }

        .container { max-width: 1100px; margin: 50px auto; }

        .header-area { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
        }

        h1 { color: var(--dark); font-size: 2rem; margin: 0; }

        /* --- Filter Bar CSS --- */
        .filter-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: var(--white);
            padding: 20px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
        }

        select {
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid #f1f5f9;
            background-color: #f8fafc;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
        }

        select:focus { border-color: var(--primary); background: #fff; }

        /* --- Table Styling --- */
        .table-container {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        th { 
            background: #f1f5f9; 
            padding: 18px; 
            color: #64748b; 
            font-weight: 600; 
            font-size: 14px;
            text-transform: uppercase;
        }

        td { padding: 15px 18px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }

        .student-info { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        
        .avatar { 
            width: 45px; 
            height: 45px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--primary);
        }

        /* --- Buttons --- */
        .view-btn {
            background: #eef2ff;
            color: var(--primary);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .view-btn:hover { background: var(--primary); color: white; }

        .call-btn {
            background: var(--success);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }

        .call-btn:hover { background: #059669; transform: translateY(-2px); }

        /* --- Profile Modal --- */
        #profileModal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 9999;
        }

        #profileModal.active { opacity: 1; visibility: visible; }

        .modal-box {
            background: white;
            width: 95%;
            max-width: 500px;
            border-radius: 30px;
            padding: 30px;
            position: relative;
        }

        .close-modal { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: #94a3b8; }

        .profile-header { text-align: center; margin-bottom: 25px; }
        .profile-header img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; border: 4px solid #f1f5f9; }

        .profile-details { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .detail-item { background: #f8fafc; padding: 12px; border-radius: 12px; font-size: 14px; }
        .detail-item strong { display: block; color: #64748b; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        /* School Branding Styles */
.school-branding {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 20px;
    gap: 10px;
}

.school-logo {
    width: 80px; /* Adjust size as needed */
    height: 80px;
    object-fit: contain;
    /* filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); */
}

.school-name {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 1px;
    color: var(--dark);
    font-weight: 800;
}

.school-address {
    margin: 5px 0;
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
}

.school-contact {
    margin: 0;
    font-size: 12px;
    color: #94a3b8;
    text-transform: uppercase;
}

.divider {
    border: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, #e2e8f0, transparent);
    margin-bottom: 30px;
}


        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .filter-bar { flex-direction: column; gap: 15px; }
            th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; }
            .profile-details { grid-template-columns: 1fr; }
            .header-area { flex-direction: column; gap: 15px; text-align: center; }
                .school-name { font-size: 1.4rem; }
    .school-logo { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
<!-- School Branding Section -->
<div class="school-branding">
    <img src="logo.jpg" alt="School Logo" class="school-logo">
    <div class="school-info">
        <h2 class="school-name">NORTH POINT ACADEMY</h2>
        <p class="school-address">
            <i class="fas fa-map-marker-alt"></i> Buddhabhumi-1, Pattharkot, Kapilvastu, Nepal
        </p>
        <p class="school-contact">Estd: 2054 | Phone: 076-XXXXXX</p>
    </div>
</div>

<hr class="divider">

    <div class="container">
        <div class="header-area">
            <h1><i class="fas fa-user-graduate"></i> Student Records</h1>
            <a onclick="window.location.back()"  style="text-decoration: none; color: var(--primary); font-weight: 600;">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <label><i class="fas fa-filter"></i> Select Class</label>
                <select id="classFilter" onchange="filterStudents()">
                    <option value="all">Show All Classes</option>
                </select>
            </div>

            <div class="filter-group">
                <label><i class="fas fa-layer-group"></i> Select Section</label>
                <select id="sectionFilter" onchange="filterStudents()">
                    <option value="all">Show All Sections</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Class</th>
                        <th>Section</th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    <!-- Data loaded by student.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal">
        <div class="modal-box">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="modalContent">
                <!-- Profile details injected here -->
            </div>
        </div>
    </div>

    <script src="student.js"></script>
    <script src="studentdata.js"></script>
</body>
</html>
